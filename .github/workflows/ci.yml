name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/recomendacion-gateway-controller-60-62
      - feature/wallet-persistence-controllers-58-59-63
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y correr tests
        run: mvn -B verify

      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SKILLSWAP_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/
      SKILLSWAP_MYSQL_TEST_USER: root
      SKILLSWAP_MYSQL_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Recorridos reales sobre MySQL
        run: mvn -B -pl app -am -Dtest=FullJourneyIntegrationTest,RealUiControllersIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
