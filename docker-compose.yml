# MySQL local para desarrollo: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: skillswap-mysql
    environment:
      MYSQL_DATABASE: skillswap
      MYSQL_USER: skillswap
      MYSQL_PASSWORD: skillswap
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - skillswap-data:/var/lib/mysql

volumes:
  skillswap-data:
